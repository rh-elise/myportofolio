<!-- ==========================================================================
     Partial: satu kartu galeri
     --------------------------------------------------------------------------
     Menampilkan video jika tersedia, jika tidak memakai gambar.
     ========================================================================== -->
<figure class="art-item">
    {% if art.video %}
        <video src="{{ art.video }}" muted loop autoplay playsinline></video>
    {% else %}
        <img src="{{ art.image }}" alt="{{ art.title }}">
    {% endif %}

    <figcaption>{{ art.title }}</figcaption>
</figure>
