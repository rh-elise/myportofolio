<script>
    // ======================================================================
    // Halaman Experience: konfigurasi endpoint dan state
    // ======================================================================

    // Angka 0 hanya placeholder, nanti diganti id asli oleh experienceEndpoint().
    const EXPERIENCES_ENDPOINT = "{% url 'api:experience-list' %}";
    const EXPERIENCE_DETAIL_ENDPOINT = "{% url 'api:experience-detail' 0 %}";
    const EXPERIENCE_STAR_ENDPOINT = "{% url 'api:experience-star' 0 %}";
    const EXPERIENCE_EDIT_ENDPOINT = "{% url 'main:update_experience' 0 %}";
    const LOGIN_URL = "{% url 'main:login' %}";
    const IS_AUTHENTICATED = "{{ user.is_authenticated|yesno:'true,false' }}" === "true";
    const IS_EDITOR = "{{ perms.main.change_experience|yesno:'true,false' }}" === "true";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const SEARCH_DEBOUNCE_DELAY = 300;

    const expSearchForm = document.getElementById('experience-search-form');
    const expSearchInput = document.getElementById('search-input');
    const expGrid = document.getElementById('exp-grid');
    const expLoading = document.getElementById('loading');
    const expError = document.getElementById('error');
    const expEmpty = document.getElementById('empty-ajax');
    const experienceForm = document.getElementById('experience-form');

    let expAbort;
    let expDebounceTimer;

    // ======================================================================
    // Utilitas
    // ======================================================================

    // Ubah karakter khusus HTML menjadi entity sebelum masuk innerHTML.
    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    // /api/v1/experience/0/  ->  /api/v1/experience/5/
    function experienceEndpoint(pattern, id) {
        return pattern.replace('/0/', `/${id}/`);
    }

    function getCookie(name) {
        const prefix = `${name}=`;
        const cookie = document.cookie
            .split(';')
            .map((value) => value.trim())
            .find((value) => value.startsWith(prefix));
        return cookie ? decodeURIComponent(cookie.slice(prefix.length)) : null;
    }

    function apiErrorMessage(data, status) {
        const messages = Object.values(data)
            .flat()
            .filter((value) => typeof value === 'string');
        return messages.join(' ') || `Request failed (HTTP ${status}).`;
    }

    // Satu pintu untuk POST/PATCH/DELETE: kirim JSON + token CSRF,
    // lalu lempar pesan error dari DRF bila request gagal.
    async function writeExperience(url, method, payload) {
        const options = {
            method: method,
            headers: {
                Accept: 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            credentials: 'same-origin',
        };

        if (payload !== undefined) {
            options.headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(payload);
        }

        const response = await fetch(url, options);

        if (response.status === 204) return null;

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            const error = new Error(apiErrorMessage(data, response.status));
            error.data = data;
            error.status = response.status;
            throw error;
        }

        return data;
    }

    // ======================================================================
    // Status tampilan
    // ======================================================================

    function setExpState(mode) {
        expLoading.classList.toggle('hide', mode !== 'loading');
        expError.classList.toggle('hide', mode !== 'error');
        expEmpty.classList.toggle('hide', mode !== 'empty');
        expGrid.classList.toggle('hide', mode !== 'grid');
    }

    // ======================================================================
    // Render kartu dan modal
    // ======================================================================

    function buildDeleteModal(item) {
        const holder = document.createElement('div');
        holder.innerHTML =
            `<div id="delete-experience-${item.id}" class="project-delete-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="delete-experience-title-${item.id}">
               <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-experience-${item.id}" popovertargetaction="hide" aria-label="Close delete confirmation"></button>
               <div class="project-delete-modal__content">
                 <button type="button" class="project-delete-modal__close" popovertarget="delete-experience-${item.id}" popovertargetaction="hide" aria-label="Close delete confirmation">×</button>
                 <div class="project-delete-modal__flag" aria-hidden="true"><img src="/static/img/warning-flag.svg" alt=""></div>
                 <h2 id="delete-experience-title-${item.id}">Delete this experience?</h2>
                 <p class="project-delete-modal__desc">Are you sure you want to delete “<strong>${escapeHtml(item.title)}</strong>”?<br><span>This experience will be permanently deleted and cannot be recovered.</span></p>
                 <div class="project-delete-modal__actions">
                   <button type="button" class="project-delete-modal__btn project-delete-modal__btn--ghost" popovertarget="delete-experience-${item.id}" popovertargetaction="hide"><span>Cancel</span></button>
                   <button type="button" class="project-delete-modal__btn project-delete-modal__btn--danger" data-action="delete" data-id="${item.id}"><span>Yes, Delete</span></button>
                 </div>
               </div>
             </div>`;
        return holder.firstElementChild;
    }

    function buildExpCard(item) {
        const yearLabel = item.status === 'ongoing'
            ? `${item.year}-present`
            : item.year;

        const photoHtml = item.thumbnail
            ? `<div class="exp-photo"><img src="${escapeHtml(item.thumbnail)}" alt="${escapeHtml(item.title)}"></div>`
            : '';

        // Tombol star: pengguna login memakai API, tamu diarahkan ke login.
        const starHtml = IS_AUTHENTICATED
            ? `<button type="button" class="button button-star exp-star${item.is_starred ? ' is-starred' : ''}"
                 data-star-url="${experienceEndpoint(EXPERIENCE_STAR_ENDPOINT, item.id)}"
                 title="${item.star_count} stars"
                 aria-label="${item.is_starred ? 'Unstar' : 'Star'} ${escapeHtml(item.title)}">
                 <span class="exp-star__icon" aria-hidden="true">${item.is_starred ? '★' : '☆'}</span><span class="exp-star__count">${item.star_count}</span></button>`
            : `<a href="${LOGIN_URL}" class="button button-star exp-star" title="Login to star">
                 <span class="exp-star__icon" aria-hidden="true">☆</span><span class="exp-star__count">${item.star_count}</span></a>`;

        // Menu edit/hapus hanya untuk Editor; hapus hanya untuk superuser.
        // Pakai popover supaya tidak tertutup ribbon tahun.
        const menuHtml = IS_EDITOR
            ? `<div class="exp-menu">
                 <button type="button" class="exp-menu__trigger"
                         aria-haspopup="true" aria-expanded="false"
                         aria-label="Options for ${escapeHtml(item.title)}"
                         title="Options">&#8942;</button>
                 <div class="exp-menu__list" popover="manual" role="menu">
                   <a role="menuitem" href="${experienceEndpoint(EXPERIENCE_EDIT_ENDPOINT, item.id)}"><span aria-hidden="true">&#9998;</span>Edit</a>
                   ${IS_SUPERUSER ? `<button type="button" role="menuitem" popovertarget="delete-experience-${item.id}" aria-label="Delete ${escapeHtml(item.title)}"><span aria-hidden="true">&times;</span>Delete</button>` : ''}
                 </div>
               </div>`
            : '';

        const article = document.createElement('article');
        article.className = 'exp-card';
        article.dataset.id = item.id;
        article.innerHTML =
            `<div class="exp-name"><span>${escapeHtml(item.title)}</span></div>` +
            `<div class="exp-year"><span>${escapeHtml(yearLabel)}</span></div>` +
            `<div class="exp-body">${photoHtml}` +
            `<div class="exp-content">${starHtml}` +
            `<p class="exp-desc">${escapeHtml(item.description)}</p>` +
            `<div class="exp-footer">${menuHtml}</div>` +
            `</div></div>`;

        // Reset aria-expanded saat menu tertutup.
        const menuList = article.querySelector('.exp-menu__list');
        if (menuList) {
            menuList.addEventListener('toggle', (event) => {
                if (event.newState === 'closed') {
                    menuList.closest('.exp-menu')
                        ?.querySelector('.exp-menu__trigger')
                        ?.setAttribute('aria-expanded', 'false');
                }
            });
        }

        return article;
    }

    // ======================================================================
    // Ambil data dari API
    // ======================================================================

    async function fetchExperiences(query = '') {
        if (expAbort) expAbort.abort();
        expAbort = new AbortController();

        setExpState('loading');

        try {
            const url = new URL(EXPERIENCES_ENDPOINT, window.location.origin);
            if (query) url.searchParams.set('title', query);

            const response = await fetch(url, {
                headers: { Accept: 'application/json' },
                signal: expAbort.signal,
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const items = await response.json();
            expGrid.replaceChildren();

            items.forEach((item) => {
                expGrid.appendChild(buildExpCard(item));
                if (IS_SUPERUSER) expGrid.appendChild(buildDeleteModal(item));
            });

            if (items.length === 0) {
                expEmpty.querySelector('p').textContent = query
                    ? 'No experience found.'
                    : 'No experience has been added yet.';
                setExpState('empty');
                return;
            }

            setExpState('grid');
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error(error);
            setExpState('error');
        }
    }

    // ======================================================================
    // Tambah Experience
    // ======================================================================

    async function addExperience(event) {
        event.preventDefault();

        const submitButton = experienceForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        FormErrors.clear(experienceForm);

        try {
            const fields = new FormData(experienceForm);
            const payload = {};

            ['title', 'description', 'category', 'thumbnail', 'year', 'status'].forEach((name) => {
                payload[name] = (fields.get(name) || '').toString();
            });

            await writeExperience(EXPERIENCES_ENDPOINT, 'POST', payload);

            experienceForm.reset();
            document.getElementById('add-experience-modal').hidePopover();
            showToast('Success', 'Experience added.', 'success');
            await fetchExperiences(expSearchInput.value.trim());
        } catch (error) {
            // Error field tampil di bawah input; toast untuk kegagalan lain.
            const shown = error.data ? FormErrors.show(experienceForm, error.data) : 0;
            if (!shown) showToast('Could not add experience', error.message, 'error');
        } finally {
            submitButton.disabled = false;
        }
    }

    if (experienceForm) {
        experienceForm.addEventListener('submit', addExperience);
    }

    // ======================================================================
    // Hapus Experience
    // ----------------------------------------------------------------------
    // Bintang ditangani experience_star.js; listener ini hanya untuk hapus.
    // ======================================================================

    expGrid.addEventListener('click', async function (event) {
        const button = event.target.closest('button[data-action="delete"]');
        if (!button || button.disabled) return;

        const id = button.dataset.id;
        button.disabled = true;

        try {
            await writeExperience(
                experienceEndpoint(EXPERIENCE_DETAIL_ENDPOINT, id),
                'DELETE'
            );
            document.getElementById(`delete-experience-${id}`)?.hidePopover();
            showToast('Success', 'Experience deleted.', 'success');
            await fetchExperiences(expSearchInput.value.trim());
        } catch (error) {
            showToast('Could not delete experience', error.message, 'error');
        } finally {
            if (button.isConnected) button.disabled = false;
        }
    });

    // Menu aksi edit/hapus.
    // Popover manual: klik tombol yang sama atau klik di luar menu menutupnya.

    function closeExpMenu(list) {
        if (!list) return;
        list.hidePopover();
        list.closest('.exp-menu')
            ?.querySelector('.exp-menu__trigger')
            ?.setAttribute('aria-expanded', 'false');
    }

    function closeAllExpMenus(except) {
        document.querySelectorAll('.exp-menu__list').forEach((list) => {
            if (list !== except && list.matches(':popover-open')) closeExpMenu(list);
        });
    }

    expGrid.addEventListener('click', function (event) {
        const choice = event.target.closest('.exp-menu__list a, .exp-menu__list button');
        if (choice) {
            closeExpMenu(choice.closest('.exp-menu__list'));
            return;
        }

        const trigger = event.target.closest('.exp-menu__trigger');
        if (!trigger) return;

        const list = trigger.parentElement.querySelector('.exp-menu__list');
        if (!list) return;

        if (list.matches(':popover-open')) {
            closeExpMenu(list);
            return;
        }

        closeAllExpMenus(list);

        // Ukur dulu tanpa terlihat, lalu posisikan di atas tombol.
        list.style.visibility = 'hidden';
        list.showPopover();

        const triggerRect = trigger.getBoundingClientRect();
        const listRect = list.getBoundingClientRect();
        const margin = 8;

        let top = triggerRect.top - listRect.height - 6;
        if (top < margin) top = triggerRect.bottom + 6;

        let left = triggerRect.right - listRect.width;
        left = Math.max(
            margin,
            Math.min(left, window.innerWidth - listRect.width - margin)
        );

        list.style.top = `${Math.round(top)}px`;
        list.style.left = `${Math.round(left)}px`;
        list.style.visibility = '';
        trigger.setAttribute('aria-expanded', 'true');
    });

    // Klik di luar menu menutup menu.
    document.addEventListener('pointerdown', function (event) {
        if (event.target.closest('.exp-menu')) return;
        closeAllExpMenus();
    });

    // Tombol Escape juga menutup menu.
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAllExpMenus();
    });

    // Tutup menu saat halaman digulir.
    window.addEventListener('scroll', function () {
        closeAllExpMenus();
    }, { passive: true });

    // ======================================================================
    // Pencarian dengan debounce
    // ======================================================================

    if (expSearchForm) {
        expSearchInput.addEventListener('input', function () {
            clearTimeout(expDebounceTimer);
            expDebounceTimer = setTimeout(
                () => fetchExperiences(expSearchInput.value.trim()),
                SEARCH_DEBOUNCE_DELAY
            );
        });

        expSearchForm.addEventListener('submit', function (event) {
            event.preventDefault();
            clearTimeout(expDebounceTimer);
            fetchExperiences(expSearchInput.value.trim());
        });

        fetchExperiences(expSearchInput.value.trim());
    }
</script>
