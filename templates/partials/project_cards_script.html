<script>
    const SEARCH_DEBOUNCE_DELAY = 300;
    const PROJECTS_ENDPOINT = "/api/projects/";
    const IS_EDITOR = "{{ perms.main.change_projects|yesno:'true,false' }}" === "true";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const CSRF_TOKEN = "{{ csrf_token }}";

    let mainImg = document.getElementById('projectSelectedImg');
    let mainTitle = document.getElementById('projectHeroTitle');
    let mainDesc = document.getElementById('projectHeroDesc');
    let mainLink = document.getElementById('projectHeroLink');
    let heroStarForm = document.getElementById('heroStarForm');
    let heroStarBtn = document.getElementById('heroStarBtn');
    let heroStarIcon = document.getElementById('heroStarIcon');
    let heroStarLabel = document.getElementById('heroStarLabel');
    let heroStarCount = document.getElementById('heroStarCount');
    let cards = [];
    let searchAbort;
    let searchDebounceTimer;

    // Samakan karakter khusus HTML jadi entity sebelum masuk HTML
    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function selectCard(card) {
        cards.forEach((c) => c.classList.remove('is-active'));
        card.classList.add('is-active');

        mainImg.src = card.getAttribute('data-img');
        mainImg.alt = card.getAttribute('data-title');
        mainTitle.textContent = card.getAttribute('data-title').toUpperCase();
        mainDesc.textContent = card.getAttribute('data-desc');

        const link = card.getAttribute('data-link');
        if (link) {
            mainLink.style.display = '';
            mainLink.href = link;
        } else {
            mainLink.style.display = 'none';
        }

        if (heroStarForm) {
            const starred = card.getAttribute('data-starred') === 'true';
            const count = card.getAttribute('data-count');
            heroStarForm.action = '/projects/' + card.getAttribute('data-id') + '/star/';
            heroStarBtn.classList.toggle('is-starred', starred);
            heroStarIcon.textContent = starred ? '★' : '☆';
            heroStarLabel.textContent = starred ? 'Starred' : 'Star';
            heroStarCount.textContent = count;
            heroStarBtn.title = 'Stars: ' + count;
        }
    }

    function bindMiniCards() {
        cards = document.querySelectorAll('.mini-card');
        cards.forEach((card) => {
            card.addEventListener('click', (event) => {
                if (event.target.closest('.mini-card-menu, .star-form')) return;
                selectCard(card);
            });
            card.addEventListener('keydown', (event) => {
                if (event.target.closest('.mini-card-menu, .star-form')) return;
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectCard(card);
                }
            });
        });
    }

    function buildDeleteModal(pk, title) {
        const holder = document.createElement('div');
        holder.innerHTML =
            '<div id="delete-project-' + pk + '" class="project-delete-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="delete-project-title-' + pk + '">' +
            '<button type="button" class="project-delete-modal__backdrop" popovertarget="delete-project-' + pk + '" popovertargetaction="hide" aria-label="Close delete confirmation"></button>' +
            '<div class="project-delete-modal__content">' +
            '<button type="button" class="project-delete-modal__close" popovertarget="delete-project-' + pk + '" popovertargetaction="hide" aria-label="Close delete confirmation">×</button>' +
            '<div class="project-delete-modal__flag" aria-hidden="true"><img src="/static/img/warning-flag.svg" alt=""></div>' +
            '<h2 id="delete-project-title-' + pk + '">Delete this project?</h2>' +
            '<p class="project-delete-modal__desc">Are you sure you want to delete “<strong>' + escapeHtml(title) + '</strong>”?<br><span>This project will be permanently deleted and cannot be recovered.</span></p>' +
            '<div class="project-delete-modal__actions">' +
            '<button type="button" class="project-delete-modal__btn project-delete-modal__btn--ghost" popovertarget="delete-project-' + pk + '" popovertargetaction="hide"><span>Cancel</span></button>' +
            '<form method="post" action="/projects/' + pk + '/delete/"><input type="hidden" name="csrfmiddlewaretoken" value="' + CSRF_TOKEN + '">' +
            '<button type="submit" class="project-delete-modal__btn project-delete-modal__btn--danger"><span>Yes, Delete</span></button></form>' +
            '</div></div></div>';
        return holder.firstChild;
    }

    function buildMiniCard(item) {
        const fields = item.fields;
        const starred = fields.is_starred;
        const card = document.createElement('div');
        card.className = 'mini-card';
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('data-title', fields.title);
        card.setAttribute('data-desc', fields.description);
        card.setAttribute('data-img', fields.image);
        card.setAttribute('data-link', fields.link || '');
        card.setAttribute('data-id', item.pk);
        card.setAttribute('data-count', fields.star_count);
        card.setAttribute('data-starred', starred ? 'true' : 'false');
        card.innerHTML =
            '<img src="' + escapeHtml(fields.image) + '" alt="' + escapeHtml(fields.title) + '">' +
            '<span class="mini-card-label">' + escapeHtml(fields.title) + '</span>' +
            '<form method="post" action="/projects/' + item.pk + '/star/" class="star-form"><input type="hidden" name="csrfmiddlewaretoken" value="' + CSRF_TOKEN + '">' +
            '<button type="submit" class="button button-star' + (starred ? ' is-starred' : '') + '" title="' + fields.star_count + ' stars" aria-label="Star ' + escapeHtml(fields.title) + '">' +
            '<span aria-hidden="true">' + (starred ? '★' : '☆') + '</span><span>' + fields.star_count + '</span></button></form>' +
                (IS_EDITOR
                ? '<details class="mini-card-menu"><summary class="mini-card-delete" aria-label="Options for ' + escapeHtml(fields.title) + '" title="Options">&#8942;</summary>' +
                  '<div class="mini-card-menu__list"><a href="/projects/' + item.pk + '/edit/"><span aria-hidden="true">&#9998;</span>Edit</a>' +
                  (IS_SUPERUSER ? '<button type="button" popovertarget="delete-project-' + item.pk + '" aria-label="Delete ' + escapeHtml(fields.title) + '"><span aria-hidden="true">&times;</span>Delete</button>' : '') +
                  '</div></details>'
                : '');

        const box = document.getElementById('miniCardsContainer');
        box.appendChild(card);
        if (IS_SUPERUSER) box.appendChild(buildDeleteModal(item.pk, fields.title));
    }

    function displayPageSection({showLoading = false, showError = false, showEmpty = false, showGrid = false}) {
        document.getElementById('loading').classList.toggle('hide', !showLoading);
        document.getElementById('error').classList.toggle('hide', !showError);
        document.getElementById('empty').classList.toggle('hide', !showEmpty);
        document.getElementById('project-showcase').classList.toggle('hide', !showGrid);
    }

    function fetchProjects(query = "") {
        if (searchAbort) searchAbort.abort();
        searchAbort = new AbortController();
        displayPageSection({showLoading: true});
        const url = query ? PROJECTS_ENDPOINT + '?title=' + encodeURIComponent(query) : PROJECTS_ENDPOINT;
        fetch(url, {signal: searchAbort.signal, headers: {'Accept': 'application/json'}}).then((response) => {
            if (!response.ok) throw new Error('fetch failed');
            return response.json();
        }).then((items) => {
            if (items.length === 0) {
                document.querySelector('#empty p').textContent = query ? 'No projects found.' : 'No projects have been added yet.';
                displayPageSection({showEmpty: true});
                return;
            }
            document.getElementById('miniCardsContainer').innerHTML = '';
            items.forEach((item) => buildMiniCard(item));
            bindMiniCards();
            selectCard(document.querySelector('.mini-card'));
            displayPageSection({showGrid: true});
        }).catch((error) => {
            if (error.name === 'AbortError') return;
            displayPageSection({showError: true});
        });
    }

    function closeProjectModal() {
        document.getElementById("add-project-modal").hidePopover();
    }

    // Baca cookie csrf buat fetch
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    bindMiniCards();

    // Cari project tanpa reload + kirim form modal tanpa reload
    const searchForm = document.getElementById('project-search-form');
    if (searchForm) {
        const searchInput = document.getElementById('search-input');
        const CREATE_PROJECT_ENDPOINT = "{% url 'main:create_project_ajax' %}";
        const projectForm = document.getElementById('project-form');

        searchForm.addEventListener('submit', (event) => {
            event.preventDefault();
            clearTimeout(searchDebounceTimer);
            fetchProjects(searchInput.value.trim());
        });

        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => fetchProjects(searchInput.value.trim()), SEARCH_DEBOUNCE_DELAY);
        });

        // Kirim form modal tanpa reload
        async function addProject(event) {
            event.preventDefault();

            const submitButton = projectForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            try {
                const response = await fetch(CREATE_PROJECT_ENDPOINT, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') },
                    body: new FormData(projectForm),
                });
                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    projectForm.reset();
                    closeProjectModal();
                    showToast('Success', 'New project added!', 'success');
                    fetchProjects(searchInput.value.trim());
                } else {
                    const errorMessages = result.errors
                        ? Object.values(result.errors).flat().map(error => error.message)
                        : [result.message || `Error (status ${response.status}).`];
                    showToast('Failed to add project', errorMessages.join(' '), 'error');
                }
            } catch (error) {
                console.error('Error adding project:', error);
                showToast('Failed to add project', 'Cannot reach server. Please try again.', 'error');
            } finally {
                submitButton.disabled = false;
            }
        }

        if (projectForm) {
            projectForm.addEventListener('submit', addProject);
        }

        fetchProjects(searchInput.value.trim());
    }
</script>
