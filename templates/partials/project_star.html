<!-- Partial: tombol bintang pada kartu kecil Project. -->
<span class="star-form">
    {% if user.is_authenticated %}
        <button type="button"
                class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
                data-star-url="{% url 'api:project-star' project.id %}"
                title="{{ project.starred_by.count }} stars"
                aria-label="{% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %} {{ project.title }}">
            <span data-star-icon aria-hidden="true">{% if user in project.starred_by.all %}★{% else %}☆{% endif %}</span><span data-star-count>{{ project.starred_by.count }}</span>
        </button>
    {% else %}
        <a href="{% url 'main:login' %}" class="button button-star" title="Login to star">
            <span data-star-icon aria-hidden="true">☆</span><span data-star-count>{{ project.starred_by.count }}</span>
        </a>
    {% endif %}
</span>
