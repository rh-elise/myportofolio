<form method="post" action="{% url 'main:toggle_star' project.id %}" data-id="{{ project.id }}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
            title="{{ project.starred_by.count }} stars"
            aria-label="Star {{ project.title }}">
        <span aria-hidden="true">{% if user in project.starred_by.all %}★{% else %}☆{% endif %}</span><span>{{ project.starred_by.count }}</span>
    </button>
</form>
