{% load static %}
{% if messages %}
<div class="toast-stack" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
    <div class="toast toast--{{ message.tags|default:'info' }}" role="status">
        <span class="toast__dot" aria-hidden="true"></span>
        <span class="toast__text">{{ message }}</span>
        <button type="button" class="toast__close" onclick="this.parentElement.remove()" aria-label="Dismiss notification">×</button>
    </div>
    {% endfor %}
</div>
{% endif %}
<div id="toast-component" class="toast-component" popover="manual">
    <div class="toast-content">
        <h3 id="toast-title" class="toast-title">This is a Sample Title</h3>
        <p id="toast-message" class="toast-message">This is a Sample Message</p>
    </div>
</div>
<script src="{% static 'js/toast.js' %}"></script>
