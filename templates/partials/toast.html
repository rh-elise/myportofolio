{% load static %}

<!-- Partial: notifikasi Django dan toast dari JavaScript. -->
<div id="toast-stack"
     class="toast-stack"
     role="region"
     aria-label="Notifications"
     aria-live="polite"
     aria-atomic="false">
    {% if messages %}
        {% for message in messages %}
            <div class="toast toast--{{ message.tags|default:'info' }}" role="status">
                <span class="toast__text">{{ message }}</span>
                <button type="button"
                        class="toast__close"
                        aria-label="Dismiss notification">&times;</button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<script src="{% static 'js/toast.js' %}"></script>
