{% extends "base.html" %}

{% block content %}
    <main>
        <section class="slanted-section" id="projects">
            <div class="container">
                <div class="section-title-wrapper">
                    <div class="slanted-title"><span>ADD NEW PROJECTS</span></div>
                </div>

                <div class="project-form-outer">
                    <form method="post"
                          action="{% url 'main:create_project' %}"
                          class="project-form">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group">
                                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <p class="form-error">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="form-actions">
                            <a href="{% url 'main:show_projects' %}" class="form-cancel">Batal</a>
                            <button type="submit" class="form-submit"><span><span class="project-add-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span> Tambah Project</span></button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
